[[mgr.prepend_keymap]]
on = [ "m" ]
run = "plugin bookmarks save"
desc = "Save current position as a bookmark"

[[mgr.prepend_keymap]]
on = [ "'" ]
run = "plugin bookmarks jump"
desc = "Jump to a bookmark"

[[mgr.prepend_keymap]]
on = [ "b", "d" ]
run = "plugin bookmarks delete"
desc = "Delete a bookmark"

[[mgr.prepend_keymap]]
on = [ "b", "D" ]
run = "plugin bookmarks delete_all"
desc = "Delete all bookmarks"

[[mgr.prepend_keymap]]
on = [ "g", "r" ]
run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'

[[mgr.prepend_keymap]]
on   = [ "g", "c" ]
run  = "plugin vcs-files"
desc = "Show Git file changes"

[[mgr.prepend_keymap]]
on  = "<C-t>"
run = "plugin tv"
desc = "Jump to a file via television"

[[mgr.prepend_keymap]]
on  = "<C-d>"
run = "plugin tv dirs"
desc = "Jump to a directory via television"

[[mgr.prepend_keymap]]
on  = "<C-f>"
run = "plugin tv text"
desc = "Open files using neovim and jump to where the string is located"

[[mgr.prepend_keymap]]
on = ["M","s"]
run = "plugin sshfs -- menu"
desc = "Open SSHFS options" 

[[mgr.prepend_keymap]] 
on = "\\"
run = "plugin split-tabs spl_toggle"
desc = "Split-tabs: toggle split tabs mode"

[[mgr.prepend_keymap]]
on = "<Tab>"
run = "plugin split-tabs spl_switch_tab"
desc = "Split-tabs: switch to the other pane"

[[mgr.prepend_keymap]]
on = "P"
run = "plugin split-tabs spl_preview"
desc = "Split-tabs: toggle preview pane"
